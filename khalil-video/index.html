<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شبكة أخبار الخليل — فيديو جرافيك</title>
<style>
@font-face{font-family:'Kufi';src:url(fonts/ReemKufi.ttf) format('truetype');font-weight:400 700}
@font-face{font-family:'Cairo';src:url(fonts/Cairo.ttf) format('truetype');font-weight:200 1000}
@font-face{font-family:'Montserrat';src:url(fonts/Montserrat.ttf) format('truetype');font-weight:100 900}
:root{--night:#03140f;--indigo:#0b3a30;--glass:#2fa58a;--glass2:#1f6f5c;--turq:#5fe0b8;--gold:#f2c14e;--gold2:#c8962e;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;height:100%;overflow:hidden}
body{font-family:'Cairo',sans-serif;color:#fff}
#viewport{position:absolute;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center}
body.render #viewport{inset:0;display:block}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#03140f;flex:none;transform-origin:center}
body.render #stage{transform:none!important}
.layer{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow:hidden}
.en{font-family:'Montserrat',sans-serif}
.kufi{font-family:'Kufi',sans-serif}
.gold{background:linear-gradient(100deg,#b8862a 0%,#f2c14e 30%,#fff6d8 50%,#f2c14e 70%,#b8862a 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.glassCard{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.22);box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);backdrop-filter:blur(6px)}
.center{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}

#bg{position:absolute;inset:0}
#pattern{position:absolute;inset:-300px;opacity:.1}
#rays{position:absolute;left:50%;top:0;width:2600px;height:2600px;margin-left:-1300px;border-radius:50%;
  background:repeating-conic-gradient(rgba(242,193,78,.16) 0deg 4deg,transparent 4deg 12deg);
  -webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%)}
#fx{position:absolute;inset:0}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff6d8 0%,rgba(242,193,78,.6) 40%,transparent 75%);pointer-events:none;z-index:70}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);z-index:65}

/* emblem */
.emblem{position:absolute;left:50%;filter:drop-shadow(0 0 40px rgba(47,165,138,.55)) drop-shadow(0 0 80px rgba(226,193,90,.25))}
.lg{position:relative;width:100%;height:100%}
.lg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lg .disc{position:absolute;inset:11%;border-radius:50%;overflow:hidden;background:#fff}
.lg .disc img{width:100%;height:100%;display:block;object-fit:cover}
.lg .sheen{position:absolute;top:-20%;bottom:-20%;width:28%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg)}
.av .lg svg,.ring .lg svg,#bug .lg svg{display:none}
.av .lg .disc,.ring .lg .disc,#bug .lg .disc{inset:0}
.emblem svg{width:100%;height:100%;overflow:visible}

/* S1 */
#s1em{width:560px;height:560px;margin-left:-280px;top:420px}
#s1title{top:1060px}
#s1title .a{font-size:62px;font-weight:800;color:var(--turq);letter-spacing:.3em;padding-right:.3em}
#s1title .b{font-family:'Kufi';font-weight:700;font-size:170px;line-height:1.25;white-space:nowrap}
#s1title .c{font-family:'Montserrat';font-weight:700;font-size:34px;letter-spacing:.42em;padding-left:.42em;margin-top:16px;color:rgba(255,255,255,.85);white-space:nowrap}
#s1title .line{width:520px;height:4px;margin:26px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* S2 */
#sky{position:absolute;inset:0}
#skyline{position:absolute;left:0;bottom:0;width:1080px;height:760px}
#skyline svg{width:100%;height:100%}
.sk{fill:none;stroke:#f2c14e;stroke-width:3;stroke-linejoin:round}
#w1{top:330px;font-size:130px;font-weight:900}
#w2{top:500px}
#w2 span{font-family:'Kufi';font-weight:700;font-size:330px;line-height:1.2}
#w3{top:930px;font-size:96px;font-weight:900;line-height:1.35;text-align:center}
#w3 small{display:block;text-align:center;font-family:'Montserrat';font-weight:700;font-size:30px;letter-spacing:.4em;color:var(--turq)}
#tiles{position:absolute;left:90px;right:90px;top:760px;display:grid;grid-template-columns:1fr 1fr;gap:34px;direction:rtl}
.tile{height:330px;border-radius:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.tile svg{width:120px;height:120px;fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.tile .t{font-size:56px;white-space:nowrap;font-weight:900;line-height:1.2}
.tile .e{font-family:'Montserrat';font-weight:700;font-size:22px;letter-spacing:.3em;opacity:.7}
#tilesHead{top:330px}
#tilesHead .a{font-size:92px;font-weight:900;line-height:1.3}
#tilesHead .b{font-size:52px;font-weight:800;color:var(--turq)}

/* S3 platforms */
.plat .head{top:150px}
.plat .ico{width:230px;height:230px;border-radius:56px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.4))}
.plat .ico svg{width:100%;height:100%}
.plat .name{font-size:100px;font-weight:900;line-height:1.3;margin-top:12px}
.plat .handle{font-family:'Montserrat';font-weight:700;font-size:44px;letter-spacing:.04em;padding:8px 34px;border-radius:40px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);direction:ltr}
.phone{position:absolute;left:220px;top:760px;width:640px;height:1060px;border-radius:78px;background:#0a0a0c;padding:18px;box-shadow:0 60px 100px rgba(0,0,0,.55),0 0 0 3px rgba(255,255,255,.14)}
.screen{position:relative;width:100%;height:100%;border-radius:62px;overflow:hidden;background:#fff;color:#111}
.notch{position:absolute;left:50%;top:16px;width:160px;height:40px;margin-left:-80px;border-radius:24px;background:#0a0a0c;z-index:5}
.float{position:absolute;width:90px;height:90px}
.float svg{width:100%;height:100%}
/* facebook post */
.fb .bar{height:130px;background:#fff;border-bottom:2px solid #e4e6eb;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 16px;direction:ltr}
.fb .bar b{font-family:'Montserrat';font-weight:800;font-size:42px;color:#1877F2;letter-spacing:-.02em}
.fb .bar i{width:48px;height:48px;border-radius:50%;background:#e4e6eb;display:inline-block;margin-left:10px}
.post{padding:22px 26px;direction:rtl}
.post .who{display:flex;align-items:center;gap:16px}
.post .av{width:78px;height:78px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.post .av svg{width:62px;height:62px}
.post .nm{font-weight:900;font-size:30px;line-height:1.3}
.post .tm{font-size:22px;color:#65676b;font-weight:600}
.post .txt{margin:18px 0 14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.post .txt i{display:block;height:16px;border-radius:8px;background:#d0d3d9}
.post .img{height:380px;border-radius:12px;overflow:hidden}
.post .img svg{width:100%;height:100%;display:block}
.post .react{display:flex;align-items:center;gap:8px;margin-top:16px;direction:rtl;font-size:22px;color:#65676b;font-weight:700}
.post .react .r{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;margin-left:-12px}
.post .react .r svg{width:24px;height:24px}
.post .acts{display:flex;justify-content:space-around;border-top:2px solid #e4e6eb;margin-top:14px;padding-top:14px;font-weight:800;font-size:24px;color:#65676b}
/* instagram profile */
.ig{padding-top:90px;direction:ltr}
.ig .top{display:flex;align-items:center;gap:40px;padding:10px 34px}
.ig .ring{width:170px;height:170px;border-radius:50%;padding:7px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);flex:none}
.ig .ring>div{width:100%;height:100%;border-radius:50%;border:6px solid #fff;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ig .ring svg{width:120px;height:120px}
.ig .stats{display:flex;gap:34px;flex:1;justify-content:space-around}
.ig .stats div{display:flex;flex-direction:column;align-items:center;gap:2px}
.ig .stats b{font-family:'Montserrat';font-weight:800;font-size:34px}
.ig .stats s{font-family:'Montserrat';font-size:22px;color:#555;text-decoration:none}
.ig .uname{font-family:'Montserrat';font-weight:800;font-size:34px;padding:14px 34px 4px}
.ig .bio{padding:0 34px;font-weight:800;font-size:28px;direction:rtl;text-align:left}
.ig .bio2{padding:4px 34px 0;font-weight:700;font-size:24px;direction:rtl;text-align:right;display:flex;align-items:center;gap:6px}
.ig .rd{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6b6b,#c0141c);display:inline-block}
.ig .btn{margin:18px 34px;height:66px;border-radius:14px;background:#0095f6;color:#fff;font-family:'Montserrat';font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center}
.ig .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ig .grid div{height:198px}
/* telegram */
.tg{background:linear-gradient(160deg,#a7d7a0,#d7e7b2 40%,#8fc9c4);height:100%}
.tg .bar{height:140px;background:#fff;display:flex;align-items:flex-end;gap:18px;padding:0 26px 18px;direction:rtl;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tg .bar .av{width:74px;height:74px;border-radius:50%;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tg .bar .av svg{width:58px;height:58px}
.tg .bar .nm{font-weight:900;font-size:30px;line-height:1.2}
.tg .bar .sub{font-size:22px;color:#708499;font-weight:700}
.tg .pin{margin:14px 20px 0;background:rgba(255,255,255,.9);border-radius:22px;padding:10px 22px;direction:rtl;border-right:6px solid #2481cc;display:flex;flex-direction:column}
.tg .pin b{font-size:22px;color:#2481cc}
.tg .pin span{font-size:24px;font-weight:700}
.tg .msgs{position:absolute;left:0;right:0;bottom:120px;display:flex;flex-direction:column;gap:18px;padding:0 24px;direction:rtl}
.tg .msg{align-self:flex-start;width:84%;background:#fff;border-radius:28px 28px 28px 8px;padding:18px 22px 12px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.tg .msg .nm{font-weight:900;font-size:24px;color:#2481cc}
.tg .msg .ln{display:flex;flex-direction:column;gap:9px;margin:10px 0 8px;align-items:flex-start}
.tg .msg .ln i{display:block;height:14px;border-radius:7px;background:#cfd6dd}
.tg .msg .meta{display:flex;justify-content:flex-start;gap:10px;font-family:'Montserrat';font-size:18px;color:#8a9aa9;direction:ltr}
.tg .msg .img{height:200px;border-radius:16px;overflow:hidden;margin-top:6px}
.tg .msg .img svg{width:100%;height:100%;display:block}
.tg .join{position:absolute;left:0;right:0;bottom:0;height:110px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;color:#2481cc}
#plane{position:absolute;width:170px;height:170px;z-index:20;filter:drop-shadow(0 12px 20px rgba(0,0,0,.35))}
#trail{position:absolute;inset:0;z-index:19;pointer-events:none}

/* S4 orbit */
#s4em{width:380px;height:380px;margin-left:-190px;top:700px}
#orbit{position:absolute;left:0;top:0;width:1080px;height:1920px}
.orb{position:absolute;width:190px;height:190px;margin:-95px 0 0 -95px}
.orb svg{width:100%;height:100%;filter:drop-shadow(0 16px 30px rgba(0,0,0,.45))}
#s4head{top:230px}
#s4head .a{font-size:96px;font-weight:900;line-height:1.3}
#s4head .b{font-family:'Kufi';font-weight:700;font-size:130px;line-height:1.25}
#handles{position:absolute;left:110px;right:110px;top:1230px;display:flex;flex-direction:column;gap:26px}
.hrow{height:130px;border-radius:65px;display:flex;align-items:center;gap:26px;padding:0 20px 0 36px;direction:ltr}
.hrow svg{width:96px;height:96px;flex:none}
.hrow .h{font-family:'Montserrat';font-weight:800;font-size:44px;flex:1}
.hrow .p{font-weight:900;font-size:36px;opacity:.75;direction:rtl}
.hrow .h.num{font-size:64px;font-weight:900;direction:ltr}
#total{position:absolute;left:0;right:0;top:1740px;text-align:center;font-size:62px;font-weight:900}
#total b{font-family:'Kufi';font-size:84px}

/* S5 notifications */
#lock{position:absolute;left:150px;top:110px;width:780px;height:1560px;border-radius:96px;background:#0a0a0c;padding:22px;box-shadow:0 60px 120px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.14)}
#lockScr{position:relative;width:100%;height:100%;border-radius:76px;overflow:hidden}
#lockScr .wall{position:absolute;inset:0}
#lockScr .wall svg{position:absolute;left:0;bottom:0;width:100%;height:60%}
#lockTime{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:'Montserrat';font-weight:600;font-size:170px;letter-spacing:-.02em;line-height:1}
#lockDate{position:absolute;left:0;right:0;top:92px;text-align:center;font-size:34px;font-weight:700;opacity:.85}
#notifs{position:absolute;left:26px;right:26px;top:360px;display:flex;flex-direction:column;gap:18px}
.nt{height:150px;border-radius:40px;background:rgba(255,255,255,.82);color:#111;display:flex;align-items:center;gap:20px;padding:0 24px;direction:rtl;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.nt svg{width:84px;height:84px;flex:none;border-radius:22px}
.nt .c{flex:1;display:flex;flex-direction:column;gap:8px}
.nt .r1{display:flex;justify-content:space-between;align-items:center}
.nt .r1 b{font-size:28px;font-weight:900}
.nt .r1 span{font-size:22px;color:#666;font-weight:700}
.nt .r2{display:flex;align-items:center;gap:12px}
.nt .r2 em{font-style:normal;background:#e0223a;color:#fff;font-weight:900;font-size:20px;padding:1px 12px;border-radius:8px}
.nt .r2 i{display:block;height:14px;border-radius:7px;background:#9aa0a8;flex:1}
#miss{top:1700px}
#miss .a{font-size:110px;font-weight:900;line-height:1.2}
#miss .b{display:flex;align-items:center;gap:16px;font-size:44px;font-weight:800;color:var(--turq)}
#miss .b svg{width:52px;height:52px;fill:none;stroke:var(--turq);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* S6 */
#s6em{width:440px;height:440px;margin-left:-220px;top:250px}
#s6title{top:740px}
#s6title .a{font-size:56px;font-weight:800;color:var(--turq);letter-spacing:.3em;padding-right:.3em}
#s6title .b{font-family:'Kufi';font-weight:700;font-size:150px;line-height:1.25;white-space:nowrap}
#s6title .c{font-size:44px;font-weight:800;color:rgba(255,255,255,.92)}
#follow{top:1180px}
#follow .t{font-size:76px;font-weight:900;margin-bottom:28px}
#follow .rows{display:flex;flex-direction:column;gap:24px;width:860px}
#rep{margin-top:34px;display:flex;align-items:center;gap:14px;font-size:44px;font-weight:900;color:var(--gold);direction:rtl}
#rep svg{width:50px;height:50px;fill:none;stroke:var(--gold);stroke-width:7}
#fadeOut{position:absolute;inset:0;background:#000;pointer-events:none;z-index:80}

/* watermark */
#bug{position:absolute;left:0;right:0;top:44px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:60;direction:rtl}
#bug .lg{width:70px;height:70px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
#bug span{font-size:34px;font-weight:900}

#controls{position:fixed;left:0;right:0;bottom:0;height:56px;background:#111;display:flex;align-items:center;gap:14px;padding:0 16px;direction:ltr;font-family:sans-serif;font-size:14px;color:#fff}
#controls button{background:var(--gold);color:#111;border:0;border-radius:6px;font-weight:800;padding:8px 14px;cursor:pointer}
#controls input{flex:1;accent-color:var(--gold)}
body.render #controls{display:none}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="bg"></div>
  <svg id="pattern" viewBox="0 0 1680 2520"><defs><pattern id="star8" width="140" height="140" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#f2c14e" stroke-width="2" transform="translate(70 70)"><rect x="-34" y="-34" width="68" height="68"/><rect x="-34" y="-34" width="68" height="68" transform="rotate(45)"/><circle r="16"/></g>
    <path d="M0 0 L22 22 M140 0 L118 22 M0 140 L22 118 M140 140 L118 118" stroke="#f2c14e" stroke-width="2"/></pattern></defs>
    <rect width="1680" height="2520" fill="url(#star8)"/></svg>
  <div id="rays"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>

  <!-- S1: emblem + name -->
  <div class="scene" id="s1">
    <div class="emblem" id="s1em"></div>
    <div class="center" id="s1title">
      <div class="a">شبكة</div>
      <div class="b gold" id="s1name">أخبار الخليل</div>
      <div class="c">KHALELNEWS</div>
      <div class="line" id="s1line"></div>
    </div>
  </div>

  <!-- S2: Hebron -->
  <div class="scene" id="s2">
    <div id="sky"></div>
    <div id="skyline"></div>
    <div class="center" id="w1">من قلب</div>
    <div class="center" id="w2"><span class="gold" id="w2t">الخليل</span></div>
    <div class="center" id="w3"><div>نبثّ لكم الخبر</div><div class="gold" id="w3g">أولاً بأول</div></div>
    <div class="center" id="tilesHead"><div class="a">ونواكب معكم الأحداث</div><div class="b">في عموم فلسطين</div></div>
    <div id="tiles"></div>
  </div>

  <!-- S3: platforms (built by JS) -->
  <div class="scene plat" id="sFB"></div>
  <div class="scene plat" id="sIG"></div>
  <div class="scene plat" id="sTG"></div>

  <!-- S4: one network, three platforms -->
  <div class="scene" id="s4">
    <div class="center" id="s4head"><div class="a">شبكة واحدة</div><div class="b gold" id="s4b">ثلاث منصات</div></div>
    <div id="orbit"></div>
    <div class="emblem" id="s4em"></div>
    <div id="handles"></div><div id="total">أكثر من <b class="gold" id="totalN">358 ألف</b> متابع</div>
  </div>

  <!-- S5: notifications -->
  <div class="scene" id="s5">
    <div id="lock"><div id="lockScr">
      <div class="wall" id="wall"></div>
      <div id="lockDate">الخليل · فلسطين</div>
      <div id="lockTime">20:25</div>
      <div id="notifs"></div>
    </div></div>
    <div class="center" id="miss"><div class="a gold" id="missA">لا يفوتك خبر</div></div>
  </div>

  <!-- S6: outro -->
  <div class="scene" id="s6">
    <div class="emblem" id="s6em"></div>
    <div class="center" id="s6title"><div class="a">شبكة</div><div class="b gold" id="s6name">أخبار الخليل</div><div class="c">من قلب الخليل نبثّ لكم الخبر أولاً بأول</div></div>
    <div class="center" id="follow"><div class="t">تابعونا على</div><div class="rows" id="followRows"></div><div id="rep"><svg viewBox="0 0 100 100"><path d="M50 90 C50 90 24 62 24 40 a26 26 0 0 1 52 0 C76 62 50 90 50 90Z"/><circle cx="50" cy="40" r="9"/></svg>كن مراسلاً ميدانياً في منطقتك</div></div>
    <div id="fadeOut"></div>
  </div>

  <div id="bug"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
</div></div>

<div id="controls">
  <button id="playBtn">▶ Play</button>
  <input type="range" id="scrub" min="0" max="29.5" step="0.001" value="0">
  <span id="time">0.00s</span>
</div>
<audio id="music" src="music.m4a" preload="auto"></audio>

<script>
/* ============================================================
   Timeline in beats at 110 BPM. Keep in sync with music.js
   ============================================================ */
const W = 1080, H = 1920, BPM = 110, B = 60 / BPM, FPS = 30;
const b = n => n * B;
const T = {
  hit: b(4),
  s2: b(8), w2: b(9), w3: b(10.5), tiles: b(12),
  fb: b(16), ig: b(20), tg: b(24),
  s4: b(28), handles: b(32),
  s5: b(36), miss: b(41),
  s6: b(44), end: b(54)
};
const DURATION = T.end;
const CUTS = [T.s2, T.fb, T.ig, T.tg, T.s4, T.s5, T.s6];

/* ---------------- helpers ---------------- */

const E = {

  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,

};

const ctx = $('fx').getContext('2d');
const PR = rng(2024);
const parts = [...Array(90)].map(() => ({x: PR() * W, y: PR() * H, r: 3 + Math.pow(PR(), 3) * 38, sp: 20 + PR() * 90, ph: PR() * 6.28,

function drawFx(t, amt) {
  ctx.clearRect(0, 0, W, H);
  if (amt <= 0) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const y = ((p.y - t * p.sp) % (H + 200) + H + 200) % (H + 200) - 100;
    const x = p.x + Math.sin(t * .6 + p.ph) * 30;
    const tw = .5 + .5 * Math.sin(t * 2.2 + p.ph * 3);
    const a = amt * (p.r > 20 ? .16 : .55) * (.4 + .6 * tw);
    const g = ctx.createRadialGradient(x, y, 0, x, y, p.r * 2);
    g.addColorStop(0, `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${a})`);
    g.addColorStop(1, `rgba(${p.c[0]},${p.c[1]},${p.c[2]},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, p.r * 2, 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

const SCENES = {s1: [0, T.s2], s2: [T.s2, T.fb], sFB: [T.fb, T.ig], sIG: [T.ig, T.tg], sTG: [T.tg, T.s4], s4: [T.s4, T.s5], s5: [T.s5, T.s6], s6: [T.s6, T.end + 1]};

function renderAt(t) {
  // scene visibility + zoom-through transitions (exit: push in and blur, enter: settle from small)
  for (const [id, [a, e]] of Object.entries(SCENES)) {
    const el = $(id), on = t >= a - (a > 0 ? 0 : 0) && t < e;
    show(el, on); if (!on) continue;
    const kin = a > 0 ? E.outExpo(P(t, a, a + .4)) : 1, kout = e <= T.end ? E.inCubic(P(t, e - .22, e)) : 0;

  }
  let fl = 0; for (const c of CUTS) fl = Math.max(fl, c > t ? E.inCubic(P(t, c - .15, c)) : 1 - E.outCubic(P(t, c, c + .35)));
  fl = Math.max(fl, t >= T.hit ? 1 - E.outCubic(P(t, T.hit, T.hit + .5)) : 0);
  $('flash').style.opacity = fl * .75;

  // background mood per scene
  let bg = 'radial-gradient(ellipse at 50% 35%,#1c7a63 0%,#0b3a30 45%,#03140f 100%)', rays = 0, fxAmt = 1, pat = .1;
  if (t < T.s2) { rays = P(t, T.hit - .5, T.hit + .5) * .9; fxAmt = P(t, 0, 1.5); }
  else if (t < T.fb) { bg = `linear-gradient(180deg,#03140f 0%,#0b4034 ${lerp(55, 40, P(t, T.w2, T.w2 + 1))}%,#5d6b34 75%,#e0b155 100%)`; fxAmt = .7; pat = .06; }
  else if (t < T.s4) { bg = t < T.ig ? PLAT.sFB.bg : t < T.tg ? PLAT.sIG.bg : PLAT.sTG.bg; fxAmt = .45; pat = .08; }
  else if (t < T.s5) { rays = .55; }
  else if (t < T.s6) { fxAmt = .6; }
  else { rays = P(t, T.s6, T.s6 + 1); fxAmt = 1; }
  $('bg').style.background = bg;
  $('rays').style.opacity = rays; $('rays').style.transform = `translateY(${t < T.s2 ? 0 : t >= T.s6 ? -170 : -350}px) rotate(${t * 8}deg)`;
  $('pattern').style.opacity = pat; $('pattern').style.transform = `translate(${(t * 14) % 140}px,${(t * 20) % 140}px)`;
  drawFx(t, fxAmt);
  show($('bug'), t >= T.s2 && t < T.s6);
  if (t >= T.s2 && t < T.s6) st($('bug'), {op: P(t, T.s2 + .3, T.s2 + .6)});

  /* ---- S1 ---- */
  if (t < T.s2 + .05) {
    drawEmblem(Em1, t, .05, 1.15);
    const pk = P(t, T.hit, T.hit + .5);
    st($('s1em'), {s: t < T.hit ? lerp(.9, 1.05, P(t, 0, T.hit)) : lerp(1.25, 1, E.outBack(pk)) * (1 + .015 * Math.sin(t * 4))});
    const ti = $('s1title');
    [...ti.children].forEach((c, i) => {
      const a = T.hit + .05 + i * .1, k = P(t, a, a + .5);
      st(c, {op: P(t, a, a + .1), y: lerp(80, 0, E.outExpo(k)), blur: lerp(10, 0, E.outExpo(k)), s: i === 1 ? lerp(1.3, 1, E.outExpo(k)) : 1});
    });
    $('s1line').style.transform = `scaleX(${E.outExpo(P(t, T.hit + .4, T.hit + 1.2))})`;
    glint($('s1name'), t, T.hit + .6, 1.1);
  }

  /* ---- S2 ---- */
  if (t >= T.s2 && t < T.fb) {
    const toTop = E.inOutCubic(P(t, T.tiles - .1, T.tiles + .35));
    const k1 = E.outExpo(P(t, T.s2, T.s2 + .35));
    st($('w1'), {op: P(t, T.s2, T.s2 + .08) * (1 - toTop), s: lerp(1.6, 1, k1), x: shake(t, T.s2, 14)});
    const k2 = E.outExpo(P(t, T.w2, T.w2 + .4));
    st($('w2'), {op: P(t, T.w2, T.w2 + .08) * (1 - toTop), s: lerp(1.8, 1, k2), blur: lerp(20, 0, k2), x: shake(t, T.w2, 20)});
    glint($('w2t'), t, T.w2 + .3, 1.2);
    glint($('w3g'), t, T.w3 + .4, 1);
    const k3 = E.outExpo(P(t, T.w3, T.w3 + .4));
    st($('w3'), {op: P(t, T.w3, T.w3 + .1) * (1 - toTop), y: lerp(60, 0, k3)});
    // skyline rises, outlines draw, windows light up
    const sk = E.outExpo(P(t, T.w2, T.w2 + .9));
    $('skyline').style.transform = `translateY(${(1 - sk) * 700 + toTop * 120}px)`;
    $('skyline').style.opacity = 1 - toTop * .45;
    skStrokes.forEach((p, i) => { p.style.strokeDasharray = 1; p.style.strokeDashoffset = 1 - E.inOutCubic(P(t, T.w2 + .2 + i * .04, T.w2 + 1.2 + i * .04)); });
    skWins.forEach((w, i) => w.setAttribute('opacity', .85 * P(t, T.w3 + i * .06, T.w3 + .15 + i * .06)));
    const hk = P(t, T.tiles, T.tiles + .4);
    st($('tilesHead'), {op: P(t, T.tiles, T.tiles + .1), y: lerp(-60, 0, E.outExpo(hk))});
    tiles.forEach((el, i) => {
      const a = T.tiles + b(.25) + i * B * .75, k = P(t, a, a + .45);
      st(el, {op: P(t, a, a + .08), s: lerp(.3, 1, E.outBack(k)), r: lerp(i % 2 ? 14 : -14, 0, E.outCubic(k)), extra: `perspective(900px) rotateX(${lerp(60, 0, E.outCubic(k))}deg)`});
    });
  }

  /* ---- S3: platforms ---- */
  for (const [id, a] of [['sFB', T.fb], ['sIG', T.ig], ['sTG', T.tg]]) {
    if (t < a || t >= a + b(4)) continue;
    const p = PLAT[id], u = t - a;
    st(p.ico, {s: E.outBack(P(u, 0, .45)), extra: `perspective(800px) rotateY(${lerp(100, 0, E.outCubic(P(u, 0, .5)))}deg)`});
    st(p.nameEl, {op: P(u, .12, .22), y: lerp(40, 0, E.outExpo(P(u, .12, .5)))});
    st(p.handleEl, {op: P(u, .22, .32), s: lerp(.6, 1, E.outBack(P(u, .22, .55)))});
    st(p.phone, {op: P(u, .05, .15), y: lerp(900, 0, E.outExpo(P(u, .05, .6))), r: lerp(8, 0, E.outCubic(P(u, .05, .7))) + Math.sin(u * 2) * .6,
                 extra: `perspective(1600px) rotateX(${lerp(25, 0, E.outCubic(P(u, .05, .7)))}deg)`});
    p.floats.forEach((f, i) => {
      if (!p.float.length) { show(f, false); return; }
      const R = rng(i * 97 + id.length), start = .45 + R() * 1.4, life = 1.1 + R() * .5, k = P(u, start, start + life);
      show(f, k > 0 && k < 1);
      const x0 = 120 + R() * 840, drift = Math.sin(u * 3 + i) * 40;
      st(f, {op: Math.sin(k * Math.PI), x: x0 + drift, y: lerp(1750, 900 + R() * 300, E.outCubic(k)), s: .6 + R() * .7});
    });
    if (id === 'sIG') p.cells.forEach((c, i) => st(c, {op: P(u, .5 + i * .06, .6 + i * .06), s: lerp(.4, 1, E.outBack(P(u, .5 + i * .06, .8 + i * .06)))}));
    if (id === 'sTG') {
      p.msgs.forEach((m, i) => { const ma = .55 + i * B * .9; st(m, {op: P(u, ma, ma + .08), y: lerp(80, 0, E.outBack(P(u, ma, ma + .35))), s: lerp(.8, 1, E.outCubic(P(u, ma, ma + .3)))}); });
      // paper plane loops across the frame, leaving a dotted trail
      const pk = E.inOutCubic(P(u, .35, 1.9));
      const pt = k => ({x: lerp(-150, 1250, k) + Math.sin(k * 6.28) * 60, y: 1500 - Math.sin(k * 3.14) * 900 - k * 200});
      const pos = pt(pk), nxt = pt(Math.min(1, pk + .01));
      const ang = Math.atan2(nxt.y - pos.y, nxt.x - pos.x) * 180 / Math.PI;
      $('plane').style.transform = `translate(${pos.x - 85}px,${pos.y - 85}px) rotate(${ang + 10}deg)`;
      $('plane').style.opacity = pk > 0 && pk < 1 ? 1 : 0;
      let d = ''; for (let k = Math.max(0, pk - .45); k <= pk; k += .01) { const q = pt(k); d += (d ? ' L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1); }
      $('trailPath').setAttribute('d', d);
    }
  }

  /* ---- S4: orbit ---- */
  if (t >= T.s4 && t < T.s5) {
    const u = t - T.s4;
    drawEmblem(Em4, t, T.s4 - 3, 1);
    st($('s4em'), {s: lerp(.4, 1, E.outBack(P(u, 0, .5)))});
    st($('s4head').children[0], {op: P(u, .1, .2), y: lerp(-50, 0, E.outExpo(P(u, .1, .5)))});
    st($('s4head').children[1], {op: P(u, .35, .45), s: lerp(1.5, 1, E.outExpo(P(u, .35, .75)))});
    glint($('s4b'), t, T.s4 + .8, 1);
    const spread = E.outExpo(P(u, .15, .9));
    orbs.forEach((o, i) => {
      const ang = u * 1.6 + i * 2.094;
      const x = 540 + Math.cos(ang) * 400 * spread, y = 890 + Math.sin(ang) * 150 * spread, depth = (Math.sin(ang) + 1) / 2;
      o.style.left = x + 'px'; o.style.top = y + 'px';
      o.style.zIndex = depth > .5 ? 5 : 1;
      st(o, {s: lerp(.62, 1.12, depth) * E.outBack(P(u, .15 + i * .08, .55 + i * .08)), op: lerp(.55, 1, depth)});
    });
    $('orbit').style.zIndex = 0; $('s4em').style.zIndex = 3;
    hrows.forEach((r, i) => {
      const a = T.handles + i * B * .6, k = P(t, a, a + .45);
      st(r, {op: P(t, a, a + .08), x: lerp(i % 2 ? -500 : 500, 0, E.outExpo(k))});
      const [, v, f] = STATS[i]; r.querySelector('.num').textContent = f(v * E.outCubic(P(t, a + .1, a + 1.3)));
    });
    const tk = P(t, T.handles + b(2.4), T.handles + b(2.4) + .5);
    st($('total'), {op: P(t, T.handles + b(2.4), T.handles + b(2.4) + .1), s: lerp(1.4, 1, E.outExpo(tk))});
    glint($('totalN'), t, T.handles + b(2.4) + .3, .9);
  }

  /* ---- S5: notifications ---- */
  if (t >= T.s5 && t < T.s6) {
    const u = t - T.s5;
    st($('lock'), {y: lerp(1200, 0, E.outExpo(P(u, 0, .6))) + shake(t, T.miss, 0) , s: lerp(1, .9, E.inOutCubic(P(t, T.miss - .2, T.miss + .4))), r: 0});
    $('lock').style.transformOrigin = '50% 0%';
    nts.forEach((n, i) => {
      const a = T.s5 + b(1) + i * B * .6, k = P(t, a, a + .4);
      st(n, {op: P(t, a, a + .06), y: lerp(-160, 0, E.outBack(k)), s: lerp(.85, 1, E.outCubic(k))});
    });
    $('lockTime').style.opacity = P(u, .2, .5);
    const mk = P(t, T.miss, T.miss + .5);
    st($('miss'), {op: P(t, T.miss, T.miss + .1), y: lerp(120, 0, E.outExpo(mk)), s: lerp(1.3, 1, E.outExpo(mk))});
    glint($('missA'), t, T.miss + .4, 1);
    $('miss').querySelector('svg').style.transform = `rotate(${Math.sin(t * 22) * 14 * (1 - P(t, T.miss + .5, T.miss + 1.5))}deg)`;
  }

  /* ---- S6: outro ---- */
  if (t >= T.s6) {
    const u = t - T.s6;
    drawEmblem(Em6, t, T.s6, 2.2);
    st($('s6em'), {s: lerp(.6, 1, E.outBack(P(u, 0, .6))) * (1 + .012 * Math.sin(t * 4))});
    [...$('s6title').children].forEach((c, i) => { const a = T.s6 + .5 + i * .1, k = P(t, a, a + .5); st(c, {op: P(t, a, a + .1), y: lerp(60, 0, E.outExpo(k)), blur: lerp(10, 0, E.outExpo(k))}); });
    glint($('s6name'), t, T.s6 + 1.1, 1.1);
    st($('follow').firstElementChild, {op: P(u, 1.1, 1.2), y: lerp(40, 0, E.outExpo(P(u, 1.1, 1.5)))});
    frows.forEach((r, i) => { const a = T.s6 + 1.35 + i * B * .5, k = P(t, a, a + .45); st(r, {op: P(t, a, a + .08), s: lerp(.6, 1, E.outBack(k))}); });
    st($('rep'), {op: P(u, 2.9, 3.0), y: lerp(30, 0, E.outExpo(P(u, 2.9, 3.3)))});
    $('fadeOut').style.opacity = E.inOutCubic(P(t, T.end - .8, T.end));
  }
}

/* ---------------- boot ---------------- */
const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render');
window.DURATION = DURATION; window.FPS = FPS; window.renderAt = renderAt;
Promise.all(['700 100px Kufi', '900 100px Cairo', '700 40px Cairo', '700 40px Montserrat', '800 40px Montserrat', '600 40px Montserrat'].map(f => document.fonts.load(f)))
  .then(() => document.fonts.ready).then(() => { renderAt(0); window.READY = true; if (!isRender) initPlayer(); });

function initPlayer() {
  const stage = $('stage'), vp = $('viewport'), audio = $('music');
  const fit = () => { stage.style.transform = `scale(${Math.min(vp.clientWidth / W, vp.clientHeight / H)})`; };
  addEventListener('resize', fit); fit();
  let playing = false, t0 = 0, start = 0, cur = 0;
  const btn = $('playBtn'), scrub = $('scrub'), time = $('time');
  const hasAudio = () => audio.readyState >= 2 && !audio.error;
  const draw = t => { cur = t; renderAt(t); scrub.value = t; time.textContent = t.toFixed(2) + 's'; };
  function tick() {
    if (!playing) return;
    let t = hasAudio() && !audio.paused ? audio.currentTime : t0 + (performance.now() - start) / 1000;
    if (t >= DURATION) { t = DURATION; pause(); }
    draw(t); requestAnimationFrame(tick);
  }
  function play() {
    if (cur >= DURATION) cur = 0;
    playing = true; btn.textContent = '❚❚ Pause'; t0 = cur; start = performance.now();
    try { audio.currentTime = cur; audio.play().catch(() => {}); } catch (e) {}
    requestAnimationFrame(tick);
  }
  function pause() { playing = false; btn.textContent = '▶ Play'; audio.pause(); }
  btn.onclick = () => playing ? pause() : play();
  scrub.oninput = () => { pause(); draw(+scrub.value); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.click(); } });
}
</script>
</body>
</html>
