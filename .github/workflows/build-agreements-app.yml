name: Build Agreements App (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, agreements-app]
    paths: ['agreements-app/**', '.github/workflows/build-agreements-app.yml']
    tags: ['agreements-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agreements-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agreements-app/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: PalAgreements-windows
          path: |
            agreements-app/dist/*.exe
            agreements-app/dist/*.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agreements-app/dist/*.exe
            agreements-app/dist/*.zip
